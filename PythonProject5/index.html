<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - JavaScript Color Changer</title>
</head>
<body>

    <!-- Header whose text color will change -->
    <h1 id="headerText">Hello</h1>

    <!-- Form with a text field and submit button -->
    <form id="colorForm">
        <label for="colorInput">Enter color: </label>
        <input type="text" id="colorInput" placeholder="e.g., red, blue, green">
        <button type="submit">Change Color</button>
    </form>

    <!-- Link to the separate JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
